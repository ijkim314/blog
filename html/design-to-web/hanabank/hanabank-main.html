<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하나은행</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="hana-home-page">
  <main class="hana-home">
    <div class="home-status" aria-label="상태 표시줄">
      <time>9:41</time>
      <div class="home-status-icons" aria-hidden="true"><span class="signal">▂▄▆█</span><span class="wifi">◒</span><span class="battery"></span></div>
    </div>

    <header class="home-header">
      <a href="#" class="login-link">로그인</a>
      <div class="header-actions">
        <button class="simple-mode" type="button"><span>홈</span> 간편</button>
        <button class="circle-ai" type="button" aria-label="AI">AI</button>
        <button class="bell" type="button" aria-label="알림"></button>
      </div>
    </header>

    <aside class="coupon-alert">
      <span class="speaker" aria-hidden="true"></span>
      <span>2월 VIP쿠폰팩이 도착했어요!</span>
      <button type="button" aria-label="닫기">×</button>
    </aside>

    <section class="hero">
      <span class="blur-orb orb-left"></span><span class="blur-orb orb-right"></span>
      <h1>로그인하고 안전하게<br><strong>잔액을 조회하세요</strong></h1>
      <button type="button" class="login-button">로그인</button>
    </section>

    <section class="account-link white-card"><strong>전체계좌</strong><span>›</span></section>

    <section class="promo-row" aria-label="프로모션">
      <article class="promo gift"><strong>금주의<br>핫픽</strong><div class="gift-art">🎁</div></article>
      <article class="promo"><i class="promo-icon pink">◎</i><strong>달달하나 컴...</strong><small>달달한 급여</small></article>
      <article class="promo"><i class="promo-icon blue">♙</i><strong>청약신규</strong><small>청약은 기본</small></article>
    </section>

    <section class="quick-menu white-card">
      <div class="quick-grid">
        <a href="#"><i class="line-icon mint">N</i><span>하나더넥스트</span></a>
        <a href="#"><i class="line-icon orange">♙</i><span>하나더소호</span></a>
        <a href="#"><i class="line-icon mint">1</i><span>하나더퍼스트</span></a>
        <a href="#"><i class="line-icon coral">※</i><span>놀이터</span></a>
        <a href="#"><i class="line-icon dark">⚽</i><span>하나원큐 축...</span></a>
        <a href="#"><i class="line-icon gold">▰</i><span>원큐지갑</span></a>
      </div>
      <button class="menu-settings" type="button">⚙ 메뉴관리</button>
    </section>

    <section class="group-card white-card">
      <div class="section-title"><h2>하나금융그룹</h2><span>›</span></div>
      <div class="chips"><button>하나증권</button><button>하나카드</button><button>하나캐피탈</button><button>하나생명</button></div>
      <article class="group-banner"><div><em>하나카드</em><small>회복과 성장의 마중물</small><strong>100% 당첨 랜덤박스</strong></div><span class="box-art">?</span></article>
    </section>

    <section class="asset-card white-card">
      <h2>내 자산</h2><div><p>로그인 후 자산을<br>확인해 보세요</p><button type="button">로그인</button></div>
    </section>

    <a class="privacy" href="#">개인정보 처리방침</a>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <a class="active" href="#"><i>⌂</i><span>홈</span></a><a href="#"><i>◉</i><span>자산</span></a><a href="#"><i>♡</i><span>상품</span></a><a href="#"><i>▧</i><span>투자</span></a><a href="#"><i>☰</i><span>메뉴</span></a>
    </nav>
  </main>
</body>
</html>
